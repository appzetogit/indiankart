# /etc/nginx/sites-available/www.indiankart.in.conf
#
# The storefront and admin panel: static files built from frontend/, released
# by scripts/deploy-site-vps.sh. `current` is a symlink to the live release, so
# a deploy or rollback is one atomic switch. API is on backend.indiankart.in.

server {
    listen 80;
    server_name indiankart.in;
    return 301 https://www.indiankart.in$request_uri;
}

server {
    listen 80;
    server_name www.indiankart.in;

    root /home/indiankart/site/current;
    index index.html;

    gzip on;
    gzip_types application/javascript text/css application/json image/svg+xml text/plain;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_vary on;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Build files have a content hash in their name, so they never change.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # Must update as soon as a new one is deployed.
    location = /firebase-messaging-sw.js {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # React routes all load index.html, which must never be cached or browsers
    # keep asking for old build files.
    location / {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri /index.html;
    }
}
