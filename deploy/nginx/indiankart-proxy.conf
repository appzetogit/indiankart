# /etc/nginx/snippets/indiankart-proxy.conf
# Proxy settings shared by the API locations of backend.indiankart.in.
proxy_pass http://indiankart_backend;
proxy_http_version 1.1;
# Reuse connections to the instances (no WebSockets in this app).
proxy_set_header Connection "";
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;

# Instance down/restarting: try the other one. nginx never re-sends a
# POST/PUT that already reached an instance, so orders and payments cannot be
# submitted twice by this.
proxy_next_upstream error timeout http_502 http_503;
proxy_next_upstream_tries 2;
proxy_next_upstream_timeout 15s;
proxy_connect_timeout 3s;
proxy_read_timeout 60s;
proxy_send_timeout 60s;
