# /etc/nginx/conf.d/ratelimit.conf  (http context)
#
# Per-IP flood protection in front of the API. Shared by both backend
# instances, so no Redis is needed for it.
#
# Sized from real traffic (10 Oct 2026): busiest customer IPs (shared mobile
# network addresses) reached ~380 requests/minute with bursts of ~90/second;
# login/OTP endpoints peaked at 3 per 10 minutes per IP. The limits below are
# several times higher than that, so customers never meet them.
limit_req_zone $binary_remote_addr zone=ik_api:20m rate=20r/s;
limit_req_zone $binary_remote_addr zone=ik_auth:10m rate=10r/m;
limit_req_status 429;
limit_req_log_level warn;

# The 429 answer needs CORS headers or the browser hides the message.
map $http_origin $ik_cors_origin {
    ~^https://(www\.)?indiankart\.in$       $http_origin;
    ~^https://flipkart-6t6p\.vercel\.app$   $http_origin;
    ~^http://(localhost|127\.0\.0\.1):5173$ $http_origin;
    default                                 "";
}
