# /etc/nginx/sites-available/backend.indiankart.in
#
# API for www.indiankart.in. Two backend instances (pm2 apps "backend" on
# 5000 and "backend-2" on 5001, see backend/ecosystem.config.cjs) behind one
# upstream. nginx spreads requests across them and, if one is down or
# restarting, retries on the other, so deploys and crashes do not drop
# requests.
#
# Adding a second machine later: add its private IP to the upstream, e.g.
#     server 172.31.x.x:5000 max_fails=3 fail_timeout=10s;
# (product images must move off this disk to S3 first; see the audit).

upstream indiankart_backend {
    least_conn;
    server 127.0.0.1:5000 max_fails=3 fail_timeout=10s;
    server 127.0.0.1:5001 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

server {
    server_name backend.indiankart.in;
    client_max_body_size 100M;

    location /uploads/ {
        alias /home/ubuntu/indiankart/backend/uploads/;
        access_log off;
        add_header Cache-Control "public, max-age=2592000, immutable";
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cross-Origin-Resource-Policy "cross-origin" always;
        add_header Vary "Accept" always;
        try_files $uri$webp_suffix $uri =404;
    }

    # Login / OTP: tight per-IP limit (each OTP is a paid SMS; also slows
    # password guessing). The backend adds its own per-number OTP limits.
    location ~ ^/api/(auth/(send-otp|verify-otp|login)|admin/login)$ {
        limit_req zone=ik_auth burst=20 nodelay;
        limit_req zone=ik_api burst=200 nodelay;
        error_page 429 = @ik_rate_limited;
        include snippets/indiankart-proxy.conf;
    }

    location / {
        limit_req zone=ik_api burst=200 nodelay;
        error_page 429 = @ik_rate_limited;
        include snippets/indiankart-proxy.conf;
    }

    location @ik_rate_limited {
        default_type application/json;
        add_header Access-Control-Allow-Origin $ik_cors_origin always;
        add_header Access-Control-Allow-Credentials "true" always;
        add_header Retry-After 60 always;
        return 429 '{"message":"Too many requests. Please wait a minute and try again.","code":"RATE_LIMITED"}';
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/backend.indiankart.in/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/backend.indiankart.in/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = backend.indiankart.in) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    server_name backend.indiankart.in;
    return 404; # managed by Certbot
}
