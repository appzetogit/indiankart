# /etc/nginx/sites-available/backend.indiankart.in
#
# API for www.indiankart.in. Two backend instances (pm2 apps "backend" on
# 5000 and "backend-2" on 5001, see backend/ecosystem.config.cjs) behind one
# upstream. nginx spreads requests across them and, if one is down or
# restarting, retries on the other, so deploys and crashes do not drop
# requests.
#
# Adding a second machine later: add its private IP to the upstream, e.g.
#     server 172.31.x.x:5000 max_fails=3 fail_timeout=10s;
# (product images must move off this disk to S3 first; see the audit).

upstream indiankart_backend {
    least_conn;
    server 127.0.0.1:5000 max_fails=3 fail_timeout=10s;
    server 127.0.0.1:5001 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

server {
    server_name backend.indiankart.in;
    client_max_body_size 100M;

    location /uploads/ {
        alias /home/ubuntu/indiankart/backend/uploads/;
        access_log off;
        add_header Cache-Control "public, max-age=2592000, immutable";
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cross-Origin-Resource-Policy "cross-origin" always;
        add_header Vary "Accept" always;
        try_files $uri$webp_suffix $uri =404;
    }

    location / {
        proxy_pass http://indiankart_backend;
        proxy_http_version 1.1;
        # Reuse connections to the instances (no WebSockets in this app).
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Instance down/restarting: try the other one. nginx never re-sends a
        # POST/PUT that already reached an instance, so orders and payments
        # cannot be submitted twice by this.
        proxy_next_upstream error timeout http_502 http_503;
        proxy_next_upstream_tries 2;
        proxy_next_upstream_timeout 15s;
        proxy_connect_timeout 3s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/backend.indiankart.in/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/backend.indiankart.in/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = backend.indiankart.in) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    server_name backend.indiankart.in;
    return 404; # managed by Certbot
}
