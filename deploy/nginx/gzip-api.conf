# /etc/nginx/conf.d/gzip-api.conf
#
# nginx.conf turns gzip on but only for text/html. The API answers in JSON
# (settings ~1.1 MB, full product list ~2.7 MB uncompressed), so compress that
# too. Typically shrinks those responses by 85-90%.
gzip_types application/json application/javascript text/css text/plain text/xml application/xml image/svg+xml;
gzip_min_length 1024;
gzip_comp_level 5;
gzip_proxied any;
gzip_vary on;
